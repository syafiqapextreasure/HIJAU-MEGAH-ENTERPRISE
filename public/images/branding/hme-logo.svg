<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <g id="hme-symbol" transform="translate(15, 8)">
    <!-- Top-left dark forest green facet -->
    <polygon points="75,12 118,36 78,56 36,32" fill="#0F4824" stroke="#F8FAF9" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Mid-left upper emerald green facet -->
    <polygon points="78,56 120,78 78,118 36,92" fill="#15803D" stroke="#F8FAF9" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Mid-right vibrant emerald green facet -->
    <polygon points="78,56 120,36 160,74 120,78" fill="#16A34A" stroke="#F8FAF9" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Bottom-left lime facet -->
    <polygon points="36,92 78,118 36,150 0,120" fill="#84CC16" stroke="#F8FAF9" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Bottom-right bright lime-yellow facet -->
    <polygon points="78,118 120,78 160,118 78,150" fill="#BEF264" stroke="#F8FAF9" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g id="hme-text" transform="translate(195, 20)">
    <!-- HME Text -->
    <text x="0" y="78" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-size="96" font-weight="900" fill="#0F172A" letter-spacing="2">HME</text>
    <!-- Registered trademark symbol -->
    <circle cx="224" cy="18" r="9" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <text x="224" y="22.5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">R</text>
    
    <!-- HIJAU MEGAH ENTERPRISE -->
    <text x="2" y="108" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#0F172A" letter-spacing="1.5">HIJAU MEGAH ENTERPRISE</text>
    
    <!-- Tagline pill banner -->
    <rect x="0" y="118" width="310" height="28" rx="6" fill="#B0F016"/>
    <text x="155" y="137" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="0.8">Construction | Landscape | Homestay</text>
  </g>
</svg>